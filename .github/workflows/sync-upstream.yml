name: Sync upstream

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve target commit
        id: resolve
        run: |
          TARGET_SHA=$(git ls-remote https://github.com/MarSeventh/CloudFlare-ImgBed.git refs/heads/main | cut -f1)
          if [ -z "$TARGET_SHA" ]; then
            echo "Failed to resolve upstream main HEAD."
            exit 1
          fi
          echo "target_sha=$TARGET_SHA" >> $GITHUB_OUTPUT
          echo "Upstream main HEAD: $TARGET_SHA"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/MarSeventh/CloudFlare-ImgBed.git || true
          git fetch upstream main

      - name: Check if update is needed
        id: check
        run: |
          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"

          # Tree comparison: ignore whitelist paths (.github 整目录),
          # if remaining tree is identical → skip
          if git diff --quiet "$TARGET_SHA" HEAD -- . \
            ':(exclude).github'; then
            echo "Already up to date with $TARGET_SHA — skipping."
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "Update needed — target: $TARGET_SHA"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Apply update
        if: steps.check.outputs.needs_update == 'true'
        run: |
          set -euo pipefail

          TARGET_SHA="${{ steps.resolve.outputs.target_sha }}"

          KEEP_DIR="/tmp/keep"
          mkdir -p "$KEEP_DIR"

          # --- Whitelist definition: .github 整目录（含本 workflow 自身 + deploy-worker）---
          # 完全保留本地版，commit 不含 workflow 文件变更，
          # push 无需 workflows 权限，也不会把上游 workflow 漂移进来。
          WHITELIST_DIRS=( ".github" )
          WHITELIST_FILES=()

          # 1. Backup whitelist directories
          for dir in "${WHITELIST_DIRS[@]}"; do
            if [ -d "$dir" ]; then
              mkdir -p "$KEEP_DIR/$dir"
              cp -r "$dir/." "$KEEP_DIR/$dir/"
              echo "Backed up directory: $dir"
            fi
          done

          # Backup whitelist files
          for f in "${WHITELIST_FILES[@]}"; do
            if [ -f "$f" ]; then
              mkdir -p "$KEEP_DIR/$(dirname "$f")"
              cp "$f" "$KEEP_DIR/$f"
              echo "Backed up file: $f"
            else
              echo "::warning::Whitelist file not found, skipping backup: $f"
            fi
          done

          # 2. Nuke all tracked files
          git rm -rq --ignore-unmatch .

          # 3. Checkout upstream tree at TARGET_SHA (exclude .github entirely)
          git checkout "$TARGET_SHA" -- . ':(exclude).github'

          # 4. Restore whitelist files from backup
          for dir in "${WHITELIST_DIRS[@]}"; do
            if [ -d "$KEEP_DIR/$dir" ]; then
              mkdir -p "$dir"
              cp -r "$KEEP_DIR/$dir/." "$dir/"
              echo "Restored directory: $dir"
            fi
          done

          for f in "${WHITELIST_FILES[@]}"; do
            if [ -f "$KEEP_DIR/$f" ]; then
              mkdir -p "$(dirname "$f")"
              cp "$KEEP_DIR/$f" "$f"
              echo "Restored file: $f"
            fi
          done

          # 5. Diff alert: compare upstream vs local for each whitelist entry
          echo "### ⚠️ Whitelist Diff Report" >> $GITHUB_STEP_SUMMARY

          HAS_DIFF=false

          # Check files inside whitelist directories
          for dir in "${WHITELIST_DIRS[@]}"; do
            if [ -d "$KEEP_DIR/$dir" ]; then
              for local_file in $(find "$KEEP_DIR/$dir" -type f); do
                rel_path="${local_file#$KEEP_DIR/}"
                upstream_content=$(git show "$TARGET_SHA:$rel_path" 2>/dev/null || true)
                if [ -z "$upstream_content" ]; then
                  echo "- ℹ️ \`$rel_path\` — 本地预期保留（上游不存在）" >> $GITHUB_STEP_SUMMARY
                elif ! diff -q <(echo "$upstream_content") "$rel_path" > /dev/null 2>&1; then
                  echo "- ⚠️ \`$rel_path\` — differs from upstream; review manually" >> $GITHUB_STEP_SUMMARY
                  HAS_DIFF=true
                fi
              done
            fi
          done

          # Check individual whitelist files
          for f in "${WHITELIST_FILES[@]}"; do
            if [ -f "$f" ]; then
              upstream_content=$(git show "$TARGET_SHA:$f" 2>/dev/null || true)
              if [ -z "$upstream_content" ]; then
                echo "- ℹ️ \`$f\` — 本地预期保留（上游不存在）" >> $GITHUB_STEP_SUMMARY
              elif ! diff -q <(echo "$upstream_content") "$f" > /dev/null 2>&1; then
                echo "- ⚠️ \`$f\` — differs from upstream; review manually" >> $GITHUB_STEP_SUMMARY
                HAS_DIFF=true
              fi
            fi
          done

          if [ "$HAS_DIFF" = false ]; then
            echo "- ✅ All whitelist files match upstream — no action needed" >> $GITHUB_STEP_SUMMARY
          fi
          # 6. Commit
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit after overlay — skipping."
          else
            git commit -m "chore: sync with upstream $TARGET_SHA"
          fi

          rm -rf "$KEEP_DIR"

      - name: Push
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git push origin main

      - name: Trigger deploy
        if: steps.check.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-worker.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Triggered deploy-worker.yml"

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.needs_update }}" = "true" ]; then
            echo "### Synced successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit:** \`${{ steps.resolve.outputs.target_sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Deploy:** triggered ✅" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Nothing to update" >> $GITHUB_STEP_SUMMARY
          fi
